<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ShortURL</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <h1>Login to ShortURL</h1>

        <form id="loginForm">

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                required
            >

            <button type="submit">
                Login
            </button>

            <p id="loginError"></p>

        </form>
    </main>

    <script src="login.js"></script>
</body>
</html>
